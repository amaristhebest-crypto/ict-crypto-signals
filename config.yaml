# ICT Institutional Market Signal Engine Configuration

# Trading universe to scan (Crypto, Commodities & US Index Futures)
symbols:
  - "NQZ2026"    # E-mini Nasdaq 100 Futures (Flagship ICT 2022 Mentorship asset)
  - "BTC/USDT"   # Bitcoin Spot/Perp
  - "ETH/USDT"   # Ethereum Spot/Perp
  - "GOLD"       # Comex Gold Futures / Spot Gold (GC=F)
  - "SILVER"     # Comex Silver Futures / Spot Silver (SI=F)
  - "CRUDE"      # WTI Crude Oil Futures (CL=F)
  - "SOL/USDT"   # Solana Spot/Perp

# Default fallback SMT Benchmark pair
smt_benchmark: "ETH/USDT"

# Timeframes
ltf_timeframe: "5m"      # Lower timeframe for liquidity sweeps, MSS, and FVG entry
htf_timeframe: "1h"      # Higher timeframe for dealing range equilibrium & macro DOL

# Execution filters
min_risk_reward: 2.0     # Minimum acceptable R:R ratio (measured against target_2)
fixed_risk_percent: 0.5  # Risk per trade (% of $50K = $250).
                         # MFFU $50K EOD max loss is $2,000 -> 0.5% gives 8 units
                         # of risk before the account is dead. 1.0% ($500) gives
                         # only 4 and is NOT survivable across a normal losing
                         # streak. Raise only after the $2,000 MLL is locked.
scan_interval_seconds: 60

# Alerts / Webhooks (Leave blank to use console only or configure via .env)
telegram_bot_token: ""
telegram_chat_id: ""
discord_webhook_url: ""
